name: Build Windows Launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained launcher
        run: dotnet publish launcher/TheTableLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheTableLauncher-Windows-x64
          path: output/**
          if-no-files-found: error
